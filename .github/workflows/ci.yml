name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python syntax + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python
        run: python -m compileall Content/Python -q
      - name: Ruff (errors only)
        run: pipx run ruff check Content/Python --select E9,F63,F7,F82
